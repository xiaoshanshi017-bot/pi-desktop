name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Install pinned Pi for local integration tests
        working-directory: runtime/pi
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Select pinned Pi CLI
        shell: pwsh
        run: |
          $piCli = (Resolve-Path 'runtime/pi/node_modules/@earendil-works/pi-coding-agent/dist/cli.js').Path
          "PI_TEST_CLI=$piCli" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm test
      - run: npm run build
